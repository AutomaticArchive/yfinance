name: Process Data

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  process-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-code

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: '.'

      - name: Clear Logs
        working-directory: .
        run: rm -f /tmp/workflow.log

      - name: Clone Project
        working-directory: .
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
        run: |
          git clone "$MIRROR_URL" project-code >> /tmp/workflow.log 2>&1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --quiet > /dev/null 2>&1

      - name: Run Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          STOCKS_API_URL: ${{ secrets.STOCKS_API_URL }}
        run: uv run main >> /tmp/workflow.log 2>&1

      - name: Upload Logs
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            HTTP_STATUS=$(
              curl -s -o /dev/null -w "%{http_code}" \
                -F "files=@/tmp/workflow.log" \
                -F "payload_json={\"content\": \"**$WORKFLOW_NAME** Log Upload for Run ID: $RUN_ID\"}" \
                "$WEBHOOK_URL"
            )
          } > /dev/null 2>&1

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Logs uploaded successfully"
          else
            echo "Failed to upload logs (HTTP Status: $HTTP_STATUS)"
          fi
